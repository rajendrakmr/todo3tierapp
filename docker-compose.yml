version: "3.8"
services:
  mysql:
    image: mysql:latest
    container_name: mysql
    ports:
      - 3306:3306
    environment:
      MYSQL_ROOT_PASSWORD: root 
      MYSQL_DATABASE: todo 
    networks:
      - todo-network 
    volumes:
      -  ./db/init.sql:/docker-entrypoint-initdb.d/init.sql
      - todovalume:/var/lib/mysql
  
  server:
    build: 
      context: ./server
    container_name: server 
    ports:
      - 5000:5000 
    environment:
      MYSQL_HOST: mysql
      MYSQL_USER: root
      MYSQL_PASSWORD: root
      MYSQL_DATABASE: todo
    depends_on: 
      - mysql
    networks:
      - todo-network
  client:
    build: 
      context: ./client
      args: 
        REACT_APP_SERVER_URL: http://52.30.214.163:5000
    container_name: client 
    ports:
      - 80:80 
    depends_on: 
      - server
    networks:
      - todo-network
    
networks:
  todo-network:
volumes:
  todovalume:
  
  
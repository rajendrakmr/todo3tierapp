apiVersion: apps/v1
kind: Deployment
metadata:
  name: react-deployent
  namespace: todo3tier
  labels:
    app: reactfronted
spec:
  replicas: 3
  selector:
    matchLabels:
      app: react-deployent
  template:
    metadata:
      labels:
        app: react-deployent
    spec:
      containers:
        - name: react-fronted
          image: rk0617/todo3tier-fronted:latest 
          ports:
          - containerPort: 80
          resources:
            requests:
              memory: "512Mi"
              cpu: "250m"
            limits: 
              memory: "1Gi"
              cpu: "500m"
 
--- 
kind: Service 
apiVersion: v1 
metadata: 
  name: reactsvc 
  namespace: todo3tier 
spec:
  type: NodePort
  selector:
    app: reactfronted
  ports:
    - protocol: TCP 
      port: 80
      targetPort: 80
      nodePort: 30080 
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: mysqlbackend
  namespace: todo3tier
  labels:
    app: mysqlbackend
spec:
  selector:
    matchLabels:
      app: mysql
  serviceName: mysql-headless
  replicas: 2
  template:
    metadata:
      labels:
        app: mysql
    spec:
      containers:
      - name: mysql
        image: mysql:latest
        ports:
        - containerPort: 3306
          name: web
        env:
          - name: MYSQL_ROOT_PASSWORD 
            valueFrom: 
              secretKeyRef:
                key: MYSQL_ROOT_PASSWORD
                name: mysecret 
          - name: MYSQL_DATABASE 
            valueFrom: 
              configMapKeyRef:
                key: MYSQL_DATABASE
                name: myconfig 
          
        volumeMounts:
        - name: mysql-data
          mountPath: /var/lib/mysql
  volumes:
  - name: mysql-data
    spec:
      persistentVolumeClaim:
        claimName: mysql-pvc 

--- 
kind: Service 
apiVersion: v1 
metadata: 
  name: mysql-headless 
  namespace: todo3tier 
spec:
  clusterIP: None
  selector:
    app: mysqlbackend
  ports:
    - protocol: TCP 
      port: 3306
      targetPort: 3306  



kind: Deployment 
apiVersion: apps/v1
metadata:
  name: nodebackend
  namespace: todo3tier
  labels:
    app: server
spec:
  replicas: 3
  selector:
    matchLabels:
      app: server 
  template:
    metadata:
      metadata:
      labels:
        app: server 
    spec:
      containers:
        - name: backendserver 
          image: rk0617/todo3tier-backend:latest
          ports:
            - containerPort: 5000 
          env:
            - name: MYSQL_HOST
              valueFrom:
                configMapKeyRef:
                  key: MYSQL_HOST 
                  name: myconfig 
            - name: MYSQL_USER
              valueFrom:
                configMapKeyRef:
                  key: MYSQL_USER 
                  name: myconfig
            - name: MYSQL_DATABASE
              valueFrom:
                configMapKeyRef:
                  key: MYSQL_DATABASE 
                  name: myconfig
            - name: MYSQL_PASSWORD
              valueFrom:
                secretKeyRef:
                  key: MYSQL_PASSWORD 
                  name: mysecret
          resources:
            requests:
              memory: "512Mi"
              cpu: "250m"
            limits: 
              memory: "1Gi"
              cpu: "500m"

---           
kind: Service 
apiVersion: v1 
metadata: 
  name: serversvc 
  namespace: todo3tier 
spec:
  type: NodePort
  selector:
    app: server
  ports:
    - protocol: TCP 
      port: 5000
      targetPort: 5000
      nodePort: 30500     




 